[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aixin-protocol-sdk"
version = "1.0.0-rc.1"
description = "Python SDK for the AiXin Signal Intent Protocol (SIP) — validate intents, canonicalize payloads, verify receipts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AiXin Protocol Contributors" }
]
keywords = ["aixin", "sip", "agentic-ai", "governance", "receipt", "validator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.21.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/aixin-protocol/aixin-protocol"
Documentation = "https://aixin-protocol.github.io/aixin-protocol/"
Repository = "https://github.com/aixin-protocol/aixin-protocol.git"
Issues = "https://github.com/aixin-protocol/aixin-protocol/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aixin_protocol_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
