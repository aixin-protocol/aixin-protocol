name: publish-validator-server
on:
  push:
    tags: ['validator-server-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Copy schemas into package
        run: |
          mkdir -p server/schemas
          cp schemas/*.schema.json server/schemas/
      - name: Install
        working-directory: server
        run: npm i --no-audit --no-fund
      - name: Test
        working-directory: server
        run: npm test
      - name: Publish
        working-directory: server
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
