name: publish-sdk-js

on:
  push:
    tags:
      - "sdk-js-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install SDK deps
        working-directory: sdk-js
        run: npm install --no-audit --no-fund

      - name: Copy schemas into package (for standalone install)
        run: |
          mkdir -p sdk-js/schemas
          cp schemas/*.schema.json sdk-js/schemas/

      - name: Test
        working-directory: sdk-js
        run: npm test

      - name: Publish to npm
        working-directory: sdk-js
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
