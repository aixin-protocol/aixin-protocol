name: publish-site
on:
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'site/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Base path (empty for custom domain, /aixin-protocol for github.io preview)'
        required: false
        default: '/aixin-protocol'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build site
        env:
          # Empty when custom domain (spec.aixin.io) is configured in Pages settings.
          # Otherwise /aixin-protocol so github.io preview resolves assets correctly.
          BASE_PATH: ${{ github.event.inputs.base_path || '/aixin-protocol' }}
        run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
